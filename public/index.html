<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eneto Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml" />
    <link rel="shortcut icon" href="./favicon.svg?v=2" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <button id="sidebar-overlay" class="sidebar-overlay" type="button" aria-label="Close sidebar"></button>
    <button id="mobile-sidebar-fab" class="mobile-sidebar-fab" type="button" aria-label="Open sidebar">☰</button>
    <main class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Chat navigation">
        <div class="sidebar-brand">
          <span class="brand-mark">
            <img class="brand-logo" src="./eneto-logo.svg" alt="Eneto" />
          </span>
          <span class="brand-eyebrow">Eneto assistant</span>
        </div>

        <button id="reset-btn" class="new-chat-btn" type="button">+ New chat</button>

        <section class="recent-section" aria-label="Recent chats">
          <div class="sidebar-section-label">Recent chats</div>
          <div id="recent-chats" class="recent-chats"></div>
        </section>

        <div class="sidebar-capabilities" aria-label="Assistant capabilities">
          <span class="topbar-pill">Live web search</span>
          <span class="topbar-pill">Files and docs</span>
        </div>
      </aside>

      <section class="chat-column">
        <header id="chat-topbar" class="chat-topbar" hidden>
          <button id="sidebar-toggle" class="mobile-menu-btn" type="button" aria-label="Open sidebar">☰</button>
          <h1 id="chat-title">New chat</h1>
          <div class="chat-menu">
            <button id="chat-menu-btn" class="chat-menu-btn" type="button" aria-label="Chat menu">•••</button>
            <div id="chat-menu-popover" class="chat-menu-popover" hidden>
              <button type="button">Rename</button>
              <button type="button">Delete</button>
              <button type="button">Export</button>
            </div>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <footer class="composer">
          <div class="composer-shell">
            <div id="attachment-row" class="attachment-row" aria-live="polite"></div>
            <div id="ingest-banner" class="ingest-banner" hidden role="status" aria-live="polite"></div>
            <div class="input-row">
              <button id="file-btn" class="icon-btn" type="button" aria-label="Upload file">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M15.7 6.3a4.5 4.5 0 0 0-6.4 0l-4 4a4.5 4.5 0 1 0 6.4 6.4l5-5a3 3 0 0 0-4.2-4.2l-5 5a1.5 1.5 0 0 0 2.1 2.1l4.2-4.2"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </button>
              <button
                id="web-search-toggle"
                class="icon-btn web-mode-btn"
                type="button"
                aria-label="Web search mode"
                title="Web search: Auto — uses smart triggering for current topics"
              >
                🌐<span id="web-search-status" class="web-mode-dot" aria-hidden="true">A</span>
              </button>
              <div class="input-shell">
                <textarea
                  id="chat-input"
                  rows="1"
                  maxlength="2000"
                  placeholder="Ask about Eneto, live updates, onboarding, or upload a file and ask about it..."
                ></textarea>
              </div>
              <button
                id="help-btn"
                class="icon-btn help-btn"
                type="button"
                aria-label="Composer help"
                title="Enter to send · Shift+Enter for new line · Attach PDFs, Office docs, text files, or images"
              >
                ?
              </button>
              <button id="send-btn" class="send-btn" type="button" aria-label="Send message">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3.4 11.3 19.9 4c.9-.4 1.8.5 1.4 1.4l-7.3 16.5c-.4.9-1.7.8-1.9-.2l-1.4-6.1-6.1-1.4c-1-.2-1.1-1.5-.2-1.9Z"
                  />
                </svg>
              </button>
            </div>
          </div>
          <input
            id="file-input"
            class="sr-only"
            type="file"
            accept=".pdf,.txt,.md,.csv,.tsv,.json,.doc,.docx,.xls,.xlsx,.pptx,.html,.xml,.yaml,.yml,.zip,.png,.jpg,.jpeg,.webp,.gif"
          />
          <p id="input-hint" class="input-hint" aria-live="polite"></p>
        </footer>
      </section>
    </main>

    <script src="./chat.js" defer></script>
  </body>
</html>
